server {
  listen 80;
  listen [::]:80;
  root /app/html;
  # server_name         myapp.com;
  # ssl_certificate     /app/ssl/cert.pem;
  # ssl_certificate_key /app/ssl/key.pem;
  # ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  # ssl_ciphers         HIGH:!aNULL:!MD5;
  
  server_tokens off;

  # bezpečnostné hlavičky (#284) – TLS ukončuje nginx proxy pred kontajnerom
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # CSP zatiaľ iba v režime Report-Only – overiť v prehliadači a potom zapnúť naostro
  # (styled-components vkladá štýly inline, API a upload na S3 bežia na iných doménach)
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # for SPA (single page application) all uris are served with index.html
  location / {
    try_files $uri /index.html;  
  }
}