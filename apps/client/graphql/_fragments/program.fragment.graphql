fragment ProgramBasicFragment on Program {
  id
  name
  description
  logoUrl
  color
  conditions
  startDate
  endDate
  maxTeams
  maxTeamSize
  teamRegSequence
  group
  regTypesAllowed

  managersIds

  deletedOn
  deletedBy
}

fragment ProgramBasicFragmentWithItems on Program {
  ...ProgramBasicFragment
  invoiceItems {
    ...InvoiceItemFragment
  }
}

fragment ProgramListFragment on Program {
  regCount
  regUnconfirmed
  regNotInvoiced
  regUnpaid
  regNotShipped
  regSetCount
  teamsInvolved
  ...ProgramBasicFragment
}

fragment ProgramFragment on Program {
  ...ProgramListFragment

  events {
    ...EventListFragment
  }
  managers {
    ...UserListFragment
  }

  invoiceItems {
    ...InvoiceItemFragment
  }
}
